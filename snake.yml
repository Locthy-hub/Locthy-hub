name: Generate Snake

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch: {}

  push:
    branches:
      - main

jobs:
  generate-snake:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
    
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Locthy-hub

          outputs: |
            dist/snake.svg?color_snake=%23D8B4FE&color_dots=%23F8BBD9,%23D8B4FE,%23BDEBFF,%239333EA,%236B21A8
            dist/snake-dark.svg?color_snake=%23F8BBD9&color_dots=%23121212,%236B21A8,%239333EA,%23D8B4FE,%23F8BBD9

    
      - name: Modernize snake SVG
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("dist/snake.svg"),
              Path("dist/snake-dark.svg")
          ]

          for file in files:
              if not file.exists():
                  continue

              svg = file.read_text(encoding="utf-8")

              # ----------------------------------------------------
              # Gradiente moderno da paleta Sanrio / Kuromi
              # ----------------------------------------------------
              gradient = """
              <defs>
                <linearGradient id="modernGradient"
                                x1="0%"
                                y1="0%"
                                x2="100%"
                                y2="0%">
                  <stop offset="0%" stop-color="#F8BBD9"/>
                  <stop offset="35%" stop-color="#D8B4FE"/>
                  <stop offset="65%" stop-color="#BDEBFF"/>
                  <stop offset="85%" stop-color="#9333EA"/>
                  <stop offset="100%" stop-color="#6B21A8"/>
                </linearGradient>

                <filter id="softGlow"
                        x="-50%"
                        y="-50%"
                        width="200%"
                        height="200%">
                  <feGaussianBlur
                    stdDeviation="1.8"
                    result="blur"/>
                  <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                  </feMerge>
                </filter>
              </defs>
              """

              # Insere os efeitos antes do conteúdo principal
              if "<defs>" not in svg:
                  svg = svg.replace(
                      ">",
                      ">" + gradient,
                      1
                  )

              # ----------------------------------------------------
              # Mantém a cobrinha e melhora a suavidade visual
              # ----------------------------------------------------
              svg = svg.replace(
                  'stroke-linecap="square"',
                  'stroke-linecap="round"'
              )

              svg = svg.replace(
                  'stroke-linejoin="miter"',
                  'stroke-linejoin="round"'
              )

              # ----------------------------------------------------
              # Aplica o gradiente aos elementos que utilizam
              # as cores da paleta original.
              # ----------------------------------------------------
              colors = [
                  "#F8BBD9",
                  "#D8B4FE",
                  "#BDEBFF",
                  "#9333EA",
                  "#6B21A8",
                  "#121212"
              ]

              for color in colors:
                  pattern = re.compile(
                      re.escape(color),
                      re.IGNORECASE
                  )

                  svg = pattern.sub(
                      "url(#modernGradient)",
                      svg
                  )

              # ----------------------------------------------------
              # Salva o SVG modificado
              # ----------------------------------------------------
              file.write_text(
                  svg,
                  encoding="utf-8"
              )

          print("Snake SVG modernizado com sucesso!")
          PY

    
      - name: Push output to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
